<!-- CSR脚本执行前的静态布局，只表达页面加载，不包含账号、余额或业务完成状态。 -->
<div class="liv-startup" role="status" aria-label="正在加载页面">
  <aside><i class="brand"></i><i></i><i></i><i></i><i></i></aside>
  <main>
    <div class="startup-projects"><i class="title"></i><div class="controls"><i></i><i></i></div><div class="cards"><article><i></i><b></b><em></em></article><article><i></i><b></b><em></em></article><article><i></i><b></b><em></em></article><article><i></i><b></b><em></em></article><article><i></i><b></b><em></em></article><article><i></i><b></b><em></em></article></div></div>
    <div class="startup-home"><i class="hero"></i><i class="subtitle"></i><div class="composer"><i></i><i></i><i></i></div><div class="shortcuts"><i></i><i></i><i></i></div></div>
    <div class="startup-session"><i></i><i></i></div>
  </main>
</div>
<style>
/* 固定深色工作区启动表面；内嵌CSS随HTML到达，不依赖JS或额外样式请求。 */
.liv-startup{position:fixed;inset:0;display:flex;background:#000;color-scheme:dark;z-index:1}.liv-startup *{box-sizing:border-box}.liv-startup i,.liv-startup b,.liv-startup em{display:block;background:#242424;border-radius:8px}.liv-startup aside{width:212px;flex:none;padding:28px;border-right:1px solid #242424}.liv-startup aside i{height:20px;width:110px;margin-bottom:26px}.liv-startup aside .brand{height:36px;width:130px;margin-bottom:50px}.liv-startup main{flex:1;min-width:0;padding:82px 28px 24px}.liv-startup .title{height:28px;width:180px}.liv-startup .controls{height:36px;margin:34px 0 22px;display:flex;justify-content:space-between}.liv-startup .controls i{width:180px;height:22px}.liv-startup .controls i:last-child{width:240px;height:36px}.liv-startup .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.liv-startup article{min-width:0;border:1px solid #242424;border-radius:16px;overflow:hidden}.liv-startup article i{aspect-ratio:16/9;border-radius:0}.liv-startup article b{height:18px;width:70%;margin:10px 12px 8px}.liv-startup article em{height:12px;width:35%;margin:0 12px 16px}.startup-home,.startup-session{display:none}.liv-startup .hero{width:280px;height:32px;margin:50px auto 20px}.liv-startup .subtitle{width:330px;max-width:85%;height:20px;margin:0 auto 30px}.liv-startup .composer{height:240px;max-width:800px;margin:auto;border:1px solid #333;border-radius:24px;padding:20px}.liv-startup .composer i{width:48px;height:48px;margin-bottom:24px}.liv-startup .composer i:nth-child(2){height:18px;width:60%}.liv-startup .composer i:last-child{height:32px;width:180px;margin-top:46px}.liv-startup .shortcuts{display:flex;justify-content:center;gap:12px;margin-top:18px}.liv-startup .shortcuts i{width:150px;height:40px}html[data-liv-startup=home] .startup-projects,html[data-liv-startup=session] .startup-projects{display:none}html[data-liv-startup=home] .startup-home{display:block}html[data-liv-startup=session] .startup-session{display:flex;justify-content:center;align-items:center;gap:8px;height:70vh}.startup-session i{width:10px;height:10px;border-radius:50%}@media(max-width:900px){.liv-startup aside{display:none}}@media(max-width:600px){.liv-startup main{padding:65px 20px 20px}.liv-startup .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.liv-startup .controls i:last-child{width:130px}.liv-startup .shortcuts i{width:90px}}@media(prefers-reduced-motion:no-preference){.liv-startup i,.liv-startup b,.liv-startup em{animation:liv-startup-pulse 1.5s ease-in-out infinite}@keyframes liv-startup-pulse{50%{opacity:.55}}}
</style>
<script>
// 仅按公开路由选布局，不访问私人存储，也不创建任何业务请求。
(()=>{const path=location.pathname.replace(/\/$/,'');document.documentElement.dataset.livStartup=path==='/dashboard'?(new URLSearchParams(location.search).has('session')?'session':'home'):'projects'})();
</script>
